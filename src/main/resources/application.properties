spring.datasource.url=jdbc:postgresql://localhost:5432/clientesdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

# Esta propiedad controla si flyway está habilitado o no
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false

# Statsig Feature Flags
statsig.server-secret-key=secret-key-placeholder
statsig.default-mask-pii=true

# URL de servicio-pedidos
pedidos.service.url=http://localhost:8082

# Observabilidad: Formato de log con traceId
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId:-}] %-5level %logger{36} - %msg%n
