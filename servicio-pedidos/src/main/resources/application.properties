# Puerto del microservicio
server.port=8082

# Nombre del microservicio
spring.application.name=servicio-pedidos

# Configuracion de conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/pedidosdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Configuracion de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# URLs de microservicios externos
clientes.url=http://localhost:8080
inventario.url=http://localhost:8081

# Configuracion Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

